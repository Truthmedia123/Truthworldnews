# .github/workflows/build.yml
#
# Builds and pushes the twn-nextjs Docker image to GitHub Container Registry (GHCR)
# on every push to main, plus on version tags (v*).
#
# Image URL: ghcr.io/truthmedia123/twn-nextjs:{tag}
#   - :latest        — latest commit on main
#   - :sha-<short>   — every commit
#   - :v1.0.0        — every git tag matching v*
#
# Prerequisites:
#   - GitHub Actions has implicit write access to ghcr.io for the repo's namespace
#     (Settings → Actions → General → Workflow permissions → Read and write)
#   - No PAT needed for ghcr.io (GITHUB_TOKEN works)

name: Build & Push Docker Image

on:
  push:
    branches: [main, migrate/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:  # manual trigger from Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # truthmedia123/truthworldnews → lowercased

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # CI builds amd64 only — arm64 builds time out under QEMU emulation.
          # Build arm64 directly on the Oracle Cloud A1 host:
          #   docker build -t ghcr.io/truthmedia123/truthworldnews:latest --platform linux/arm64 .
          #   docker push ghcr.io/truthmedia123/truthworldnews:latest
          platforms: linux/amd64

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build-time args (no secrets — those are runtime)
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

      - name: Output image URL
        if: github.event_name != 'pull_request'
        run: |
          echo "✅ Image pushed to:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo ""
          echo "Pull with:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
