name: Daily Supabase Backup

on:
  schedule:
    # Runs every day at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backup repo
        uses: actions/checkout@v4
        with:
          repository: TRUTHMEDIANETWORKS/truthworldnews-backups
          token: ${{ secrets.BACKUP_REPO_TOKEN }}
          path: backup-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase client
        run: npm install @supabase/supabase-js

      - name: Export Supabase data
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const fs = require('fs');
          const path = require('path');

          const supabase = createClient(
            process.env.SUPABASE_URL,
            process.env.SUPABASE_SERVICE_ROLE_KEY
          );

          async function backup() {
            const tables = ['posts', 'reactions', 'social_assets', 'quizzes', 'tips'];
            const backup = {};
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');

            for (const table of tables) {
              try {
                const { data, error } = await supabase.from(table).select('*');
                if (error) {
                  console.error('Error fetching ' + table + ':', error.message);
                  backup[table] = { error: error.message };
                } else {
                  backup[table] = data;
                  console.log('Fetched ' + table + ': ' + (data ? data.length : 0) + ' rows');
                }
              } catch (err) {
                console.error('Failed to fetch ' + table + ':', err.message);
                backup[table] = { error: err.message };
              }
            }

            const outDir = path.join('backup-repo', 'backups');
            if (!fs.existsSync(outDir)) fs.mkdirSync(outDir, { recursive: true });

            const filename = 'backup-' + timestamp + '.json';
            fs.writeFileSync(
              path.join(outDir, filename),
              JSON.stringify(backup, null, 2)
            );

            // Also write latest.json for quick access
            fs.writeFileSync(
              path.join(outDir, 'latest.json'),
              JSON.stringify(backup, null, 2)
            );

            console.log('Backup saved to ' + filename);
          }

          backup().catch(console.error);
          "

      - name: Commit and push backup
        working-directory: backup-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Backup $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push